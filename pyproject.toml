[project]
name = "cosmos-mini-infra"
version = "0.1.0"
description = "Mini async rollout-training pipeline for a toy world model: DDP/FSDP training, disaggregated PPO rollout/trainer with weight-sync, and profiler-driven benchmarking."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "gymnasium>=0.29",
    "numpy",
    "pyyaml",
    "matplotlib",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
